[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "case2audio"
version = "0.1.0"
description = "Turn layout-heavy PDFs into narration text and Amazon Polly audio."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "George Kolasa" }]
dependencies = [
  # Pin Docling's minor line so a model/API change cannot silently break extraction.
  "docling>=2.124,<2.125",
  # AWS console-login profiles require the Common Runtime credential provider.
  "boto3[crt]>=1.43,<2",
  # Inspect original PDF objects so black-box redactions cannot leak hidden text.
  "pypdfium2>=5.13,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
case2audio = "case2audio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
# Tests must exercise working-tree changes, not a stale installed CLI package.
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
