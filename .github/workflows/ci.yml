name: CI

on:
  # Run locally by default to save Actions minutes; manual runs remain available.
  workflow_dispatch:
  # Uncomment these triggers to restore automatic CI.
  # push:
  # pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Installation catches dependency drift; the committed PDF exercises Docling without AWS.
      - run: python -m pip install '.[dev]'
      - run: ruff check .
      - run: pytest
